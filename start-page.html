<head>

<title>Hi, Jiro! Welcome back.</title>

<!--
  BACKGROUND IMAGE
  Put your original image in the repo root as bg.jpg (or find/replace "/bg.jpg" below).
  Netlify Image CDN resizes + converts it on the fly (AVIF/WebP automatically) and caches it.
  Portrait sizes match iPhone 17 (402x874 @3x = 1206x2622).
-->
<link rel="preload" as="image" fetchpriority="high"
  media="(max-width: 600px) and (orientation: portrait)"
  imagesrcset="/.netlify/images?url=/bg.jpg&amp;w=480&amp;h=1044&amp;fit=cover&amp;q=55 480w,
               /.netlify/images?url=/bg.jpg&amp;w=800&amp;h=1739&amp;fit=cover&amp;q=55 800w,
               /.netlify/images?url=/bg.jpg&amp;w=1206&amp;h=2622&amp;fit=cover&amp;q=55 1206w"
  imagesizes="100vw">
<link rel="preload" as="image" fetchpriority="high"
  media="not all and (max-width: 600px) and (orientation: portrait)"
  imagesrcset="/.netlify/images?url=/bg.jpg&amp;w=1280&amp;h=720&amp;fit=cover&amp;q=55 1280w,
               /.netlify/images?url=/bg.jpg&amp;w=1920&amp;h=1080&amp;fit=cover&amp;q=55 1920w,
               /.netlify/images?url=/bg.jpg&amp;w=2560&amp;h=1440&amp;fit=cover&amp;q=55 2560w"
  imagesizes="100vw">

<script>document.documentElement.classList.add('js')</script>
<style>
:root{
  --ink:#0b0d12; --text:#f3f2f0; --muted:#b4b9c6; --pill:rgba(14,17,25,.62);
  --pill-hover:rgba(40,46,62,.78); --line:rgba(255,255,255,.14); --focus:#9fc3ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
  padding:
    max(24px,env(safe-area-inset-top))
    max(18px,env(safe-area-inset-right))
    max(28px,env(safe-area-inset-bottom))
    max(18px,env(safe-area-inset-left));
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

/* Background: fixed <img> (iOS ignores background-attachment:fixed) */
.bg{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;z-index:-1;overflow:hidden;background:var(--ink)}
.bg img{display:block;width:100%;height:100%;object-fit:cover}
.bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(11,13,18,.25) 0%,rgba(11,13,18,.7) 55%,rgba(11,13,18,.88) 100%)}
.js .bg img{opacity:0;transition:opacity .6s ease}
.js .bg img.ready{opacity:1}

main{width:min(1100px,100%)}
h1{
  font:700 clamp(2rem,9vw,3.5rem)/1.05 ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  letter-spacing:-.02em; text-shadow:0 2px 18px rgba(0,0,0,.45);
}
h1 span{display:block;margin-top:8px;font-size:.45em;font-weight:500;letter-spacing:0;color:var(--muted)}

.groups{display:grid;gap:22px;margin-top:28px}
h2{font-size:1rem;font-weight:600;color:var(--muted);margin-bottom:10px}
ul{list-style:none;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
a{
  display:flex;align-items:center;justify-content:center;
  min-height:52px;padding:10px 14px;border-radius:16px;
  background:var(--pill);border:1px solid var(--line);
  color:inherit;text-decoration:none;font-weight:500;text-align:center;text-wrap:balance;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:background-color .15s ease,transform .15s ease;
}
a:hover{background:var(--pill-hover)}
a:active{transform:scale(.97)}
a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

@media (min-width:960px){
  body{justify-content:center}
  .groups{grid-template-columns:repeat(3,1fr);gap:32px;margin-top:36px}
  ul{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.bg img,a{transition:none}}
</style>
</head>
<body>

<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T8NTL6JG" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="bg" aria-hidden="true">
  <picture>
    <!-- Phones in portrait: tall crops for 1x / 2x / 3x screens -->
    <source media="(max-width: 600px) and (orientation: portrait)" sizes="100vw"
      srcset="/.netlify/images?url=/bg.jpg&amp;w=480&amp;h=1044&amp;fit=cover&amp;q=55 480w,
              /.netlify/images?url=/bg.jpg&amp;w=800&amp;h=1739&amp;fit=cover&amp;q=55 800w,
              /.netlify/images?url=/bg.jpg&amp;w=1206&amp;h=2622&amp;fit=cover&amp;q=55 1206w">
    <!-- Everything else: landscape crops -->
    <img src="/.netlify/images?url=/bg.jpg&amp;w=1920&amp;h=1080&amp;fit=cover&amp;q=55" sizes="100vw"
      srcset="/.netlify/images?url=/bg.jpg&amp;w=1280&amp;h=720&amp;fit=cover&amp;q=55 1280w,
              /.netlify/images?url=/bg.jpg&amp;w=1920&amp;h=1080&amp;fit=cover&amp;q=55 1920w,
              /.netlify/images?url=/bg.jpg&amp;w=2560&amp;h=1440&amp;fit=cover&amp;q=55 2560w"
      alt="" width="1920" height="1080" fetchpriority="high" decoding="async">
  </picture>
</div>

<main>

<script>
// Fade the background in once loaded. If the Netlify image endpoint isn't available
// (local file, other host), fall back once to the original /bg.jpg.
(function(){
  var i=document.querySelector('.bg img'), fell=false;
  function show(){i.classList.add('ready')}
  i.addEventListener('load',show);
  i.addEventListener('error',function(){
    if(fell){show();return}
    fell=true;
    i.parentNode.querySelectorAll('source').forEach(function(s){s.remove()});
    i.removeAttribute('srcset');
    i.src='/bg.jpg';
  });
  if(i.complete&&i.naturalWidth)show();
})();

// Google Tag Manager: load after the page and image, so it never competes with them
window.addEventListener('load',function(){
  (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
  var f=d.getElementsByTagName(s)[0],j=d.createElement(s);j.async=true;
  j.src='https://www.googletagmanager.com/gtm.js?id='+i;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-T8NTL6JG');
});
</script>
</body>
